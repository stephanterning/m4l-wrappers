name: Fetch Max SDK
description: Fetch the pinned Cycling '74 headers and libraries used by both platforms
runs:
  using: composite
  steps:
    - name: Check out Max SDK
      uses: actions/checkout@v4
      with:
        repository: Cycling74/max-sdk-base
        ref: c03a2922a2a8ff149165a1e2ea134e9321d6e202
        path: deps/max-sdk-base
        persist-credentials: false
