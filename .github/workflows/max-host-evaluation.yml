name: Check Max-host candidates
on:
  push:
    branches: ['codex/max-vst3-host-evaluation']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/wrapper-sdks
      - name: Build the output stage and diagnostic plug-in
        shell: pwsh
        run: |
          cmake -S experimental/max-host -B build/output -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/output --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S tests/max-host/precision -B build/precision -A x64 "-DVST3_SDK=$PWD/deps/vst3sdk"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/precision --config Release --target MaxHostPrecision
      - uses: actions/upload-artifact@v4
        with:
          name: max-host-output-windows-x64
          path: build/output/externals/*.mxe64
          if-no-files-found: error
  macos:
    needs: windows
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/wrapper-sdks
      - uses: actions/download-artifact@v4
        with:
          name: max-host-output-windows-x64
          path: build/output/externals
      - name: Build frozen two-platform candidates
        run: |
          python3 build.py
          for entry in 'spectre:Spectre Wrapper' 'oxford-inflator:Oxford Inflator Wrapper'; do
            python3 experimental/max-host/build_candidate.py "${entry%%:*}" "dist/${entry#*:}.amxd" build/candidates --windows-externals build/output/externals
          done
          node tests/oxford.cjs
          node tests/spectre.cjs
          node tests/max-host/adapter.cjs
          python3 tests/max-host/package_candidate.py dist build/candidates build/output/externals
      - uses: actions/upload-artifact@v4
        with:
          name: max-host-qa-devices
          path: build/candidates/*.amxd
          if-no-files-found: error
