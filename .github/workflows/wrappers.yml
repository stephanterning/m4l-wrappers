name: Build and test wrappers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package all three portable devices
        run: python3 build.py
      - name: Check release compatibility, routing, resources and controllers
        run: |
          python3 tests/package.py dist
          node tests/max-host/adapter.cjs
          node tests/oxford.cjs
          node tests/spectre.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: m4l-wrappers
          path: dist/*.amxd
          if-no-files-found: error
