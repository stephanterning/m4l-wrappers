name: Build and test wrappers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wrapper-sdks
      - name: Configure shared gain and meter external
        run: cmake -S host -B build/output -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build/output --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: max-output-windows-x64
          path: build/output/externals/*.mxe64
          if-no-files-found: error

  package:
    needs: windows
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wrapper-sdks
      - uses: actions/download-artifact@v4
        with:
          name: max-output-windows-x64
          path: build/output/externals
      - name: Build all Max-host devices
        run: python3 build.py --windows-externals build/output/externals
      - name: Check release compatibility, routing, payloads and controllers
        run: |
          python3 tests/package.py dist build/output/externals
          node tests/max-host/adapter.cjs
          node tests/oxford.cjs
          node tests/spectre.cjs
          clang++ -std=c++17 -O2 tests/meters.cpp -o build/test-meters
          build/test-meters
      - uses: actions/upload-artifact@v4
        with:
          name: m4l-wrappers
          path: dist/*.amxd
          if-no-files-found: error
